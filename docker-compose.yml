services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: martrin
      POSTGRES_PASSWORD: martrin
      POSTGRES_DB: martrin
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - martrin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martrin -d martrin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  martrin-db:
