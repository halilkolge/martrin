name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v7

      - name: pnpm kur
        uses: pnpm/action-setup@v6

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Biçim kontrolü
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Testler
        run: pnpm test

      - name: Derleme
        run: pnpm build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v7

      - name: pnpm kur
        uses: pnpm/action-setup@v6

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Playwright Chromium kur
        run: pnpm exec playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: pnpm e2e

      - name: Playwright raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
